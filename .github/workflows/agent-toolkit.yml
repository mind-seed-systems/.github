name: Agent toolkit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install validation dependency
        run: python3 -m pip install -r scripts/requirements-toolkit.txt
      - name: Validate toolkit and repository data
        run: python3 scripts/validate_agent_toolkit.py
      - name: Test validator regressions
        run: python3 -m unittest discover -s tests -v

name: Validate organization foundation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: organization-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up validation Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Install pinned schema validation dependencies
        run: python -m pip install -r scripts/requirements-validation.txt

      - name: Validate organization metadata and links
        run: python -B scripts/validate_organization.py

      - name: Run validation regressions
        run: python -B -m unittest discover -s tests -v

      - name: Parse GitHub YAML
        shell: ruby {0}
        run: |
          require "yaml"
          paths = Dir[".github/**/*.yml", "workflow-templates/*.yml"].sort
          paths.each do |path|
            YAML.safe_load_file(path, permitted_classes: [], permitted_symbols: [], aliases: false)
            puts "parsed #{path}"
          end

      - name: Check patch whitespace
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          require_commit() {
            [[ "$1" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid commit SHA" >&2; exit 1; }
            if ! git cat-file -e "$1^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$1"
            fi
            git cat-file -e "$1^{commit}"
          }
          require_commit "$HEAD_SHA"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            require_commit "$BASE_SHA"
            base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          elif [[ "$EVENT_NAME" == push && -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
            require_commit "$BEFORE_SHA"
            base=$BEFORE_SHA
          else
            # New branches and manual runs have no event base: check the whole tree.
            base=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$base" "$HEAD_SHA"
